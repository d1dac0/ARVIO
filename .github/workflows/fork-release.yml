name: Fork release

# Builds signed sideload APKs from this fork and publishes them as a GitHub
# release so the in-app updater (BuildConfig.GITHUB_OWNER/GITHUB_REPO) and
# Obtainium can pick it up. The APK is signed with the fork's own keystore, so
# it updates fork builds in place - it cannot update an installation signed by
# the upstream release key or by Google Play.
#
# Required repository secrets:
#   KEYSTORE_BASE64      base64 of arvio-release.keystore (single line)
#   KEYSTORE_PASSWORD    keystore password
#   KEY_ALIAS            key alias inside the keystore
#   KEY_PASSWORD         key password

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fork-release
  cancel-in-progress: true

jobs:
  release:
    name: Build signed APKs and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Validate signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          : "${KEYSTORE_BASE64:?Missing KEYSTORE_BASE64 repository secret}"
          : "${KEYSTORE_PASSWORD:?Missing KEYSTORE_PASSWORD repository secret}"
          : "${KEY_ALIAS:?Missing KEY_ALIAS repository secret}"
          : "${KEY_PASSWORD:?Missing KEY_PASSWORD repository secret}"

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          BASE_CODE=$(sed -n 's/.*versionCode = providers.*?: \([0-9]\+\).*/\1/p' app/build.gradle.kts | head -n1)
          BASE_NAME=$(sed -n 's/.*versionName = providers.*?: "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)
          : "${BASE_CODE:?Could not read base versionCode from app/build.gradle.kts}"
          : "${BASE_NAME:?Could not read base versionName from app/build.gradle.kts}"

          # Every run must be a strictly higher version so devices accept the update.
          VERSION_CODE=$((BASE_CODE + GITHUB_RUN_NUMBER))
          VERSION_NAME="${BASE_NAME}-fork.${GITHUB_RUN_NUMBER}"
          {
            echo "code=$VERSION_CODE"
            echo "name=$VERSION_NAME"
            echo "tag=v$VERSION_NAME"
          } >> "$GITHUB_OUTPUT"
          echo "Building $VERSION_NAME (versionCode $VERSION_CODE)"

      - name: Prepare production signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/arvio-release.keystore"
          printf '%s\n' \
            "storeFile=$GITHUB_WORKSPACE/arvio-release.keystore" \
            "storePassword=$KEYSTORE_PASSWORD" \
            "keyAlias=$KEY_ALIAS" \
            "keyPassword=$KEY_PASSWORD" \
            > keystore.properties

      - name: Build signed release APKs
        env:
          # Optional: supply real integration credentials as repository secrets and
          # they take priority over the placeholders in secrets.defaults.properties.
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          # TMDB v3 API key (not the v4 read access token). When set, the app calls TMDB
          # directly and ENABLE_TMDB_EDGE_PROXY turns off, so Home no longer depends on
          # upstream's auth.arvio.tv proxy. When empty, the build keeps using the proxy.
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          ./gradlew assembleSideloadRelease --no-daemon \
            -ParvioVersionCode=${{ steps.version.outputs.code }} \
            -ParvioVersionName=${{ steps.version.outputs.name }} \
            -ParvioAllowMissingIntegrations=true \
            -ParvioForkReleaseAbiSplits=true

      - name: Verify and name release APKs
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          OUTPUT_DIR=app/build/outputs/apk/sideload/release
          METADATA="$OUTPUT_DIR/output-metadata.json"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner -type f | sort -V | tail -n1)
          : "${APKSIGNER:?Android apksigner not found}"

          jq -e '
            (.elements | map([.filters[] | select(.filterType == "ABI") | .value])) |
            sort == [[], ["arm64-v8a"], ["armeabi-v7a"]]
          ' "$METADATA" > /dev/null
          jq -e --argjson versionCode "$VERSION_CODE" '
            all(.elements[]; .versionCode == $versionCode)
          ' "$METADATA" > /dev/null

          mkdir -p dist
          for abi in armeabi-v7a arm64-v8a universal; do
            output=$(jq -er --arg abi "$abi" '
              .elements[] |
              select(([.filters[] | select(.filterType == "ABI") | .value][0] // "universal") == $abi) |
              .outputFile
            ' "$METADATA")
            apk="$OUTPUT_DIR/$output"
            "$APKSIGNER" verify --print-certs "$apk"
            packaged_abis=$(unzip -Z1 "$apk" | awk -F/ '$1 == "lib" && $3 ~ /[.]so$/ {print $2}' | sort -u)
            expected_abis="$abi"
            if [[ "$abi" == universal ]]; then
              expected_abis=$'arm64-v8a\narmeabi-v7a'
            fi
            if [[ "$packaged_abis" != "$expected_abis" ]]; then
              printf 'Unexpected native ABIs in %s:\n%s\n' "$apk" "$packaged_abis"
              exit 1
            fi
            cp "$apk" "dist/ARVIO-$RELEASE_VERSION-sideload-$abi-release.apk"
          done

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NOTES=$(git log -1 --pretty=%B)
          gh release create "${{ steps.version.outputs.tag }}" \
            dist/*.apk \
            --title "ARVIO ${{ steps.version.outputs.name }}" \
            --notes "$NOTES" \
            --latest
